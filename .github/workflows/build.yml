# Compila Inteliworks Talk (Android) = Nextcloud Talk Android (tag UPSTREAM_TAG) + branding/
# El APK sale SIN FIRMAR; se firma en condor3033 con tools/firmar-y-publicar.sh (el keystore no sale de ahi).
name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (branding)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Leer version upstream
        id: v
        run: |
          tag="$(tr -d '[:space:]' < UPSTREAM_TAG)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "rev=$(tr -dc '0-9' < BRANDING_REVISION)" >> "$GITHUB_OUTPUT"

      - name: Checkout Nextcloud Talk Android ${{ steps.v.outputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/talk-android
          ref: ${{ steps.v.outputs.tag }}
          path: upstream
          persist-credentials: false

      - name: Aplicar personalizacion
        run: branding/apply.sh upstream

      - name: JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Validar Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          min-wrapper-count: 1

      - name: Compilar APK release (sin firmar)
        working-directory: upstream
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.parallel=true"
          } >> gradle.properties
          ./gradlew --no-daemon assembleGenericRelease

      - name: Preparar artefacto
        id: out
        run: |
          APK=$(find upstream/app/build/outputs/apk/generic/release -name '*.apk' | head -n1)
          test -n "$APK"
          NAME="inteliworks-talk-${{ steps.v.outputs.ver }}-iw${{ steps.v.outputs.rev }}-unsigned.apk"
          mkdir -p dist && cp "$APK" "dist/$NAME"
          ls -la dist
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Subir artefacto
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inteliworks-talk-apk
          path: dist/*.apk
          retention-days: 30
